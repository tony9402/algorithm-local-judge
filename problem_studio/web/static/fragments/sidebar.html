<button
  id="sidebarToggle"
  class="sidebar-toggle"
  aria-controls="studioSidebar"
  aria-expanded="false"
  type="button"
>
  <span class="sidebar-toggle-icon" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </span>
  <span class="mobile-header-copy">
    <span id="mobileHeaderKicker">Problem Studio</span>
    <strong id="mobileHeaderTitle">문제를 선택하세요</strong>
  </span>
  <span id="mobileHeaderMeta" class="mobile-header-meta">문제 목록</span>
</button>
<div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>
<div id="alertStack" class="alert-stack" aria-live="polite"></div>
<div class="shell">
  <aside id="studioSidebar" class="sidebar" role="navigation" aria-label="문제 탐색">
    <header class="sidebar-header">
      <div>
        <h1>Problem Studio</h1>
        <p id="workspaceLabel">문제 제작 워크스페이스</p>
      </div>
      <button id="sidebarClose" class="icon sidebar-close" aria-label="문제 패널 닫기" type="button">
        ×
      </button>
    </header>

    <section class="sidebar-actions">
      <button id="newProblemButton" class="primary full" type="button">문제 추가</button>
      <button id="workspaceBuildAllButton" class="workspace-bulk-button full" type="button">
        전체 문제 테스트/팩 빌드
      </button>
    </section>

    <section class="repository-panel">
      <div class="repository-heading">
        <div class="section-title">저장소</div>
        <button
          id="repositoryRefreshButton"
          class="repository-refresh-button"
          type="button"
          aria-label="저장소 목록 새로고침"
          title="저장소 목록 새로고침"
        >
          <span aria-hidden="true">↻</span>
        </button>
      </div>
      <select id="repositorySelect" aria-label="문제 저장소 선택"></select>
      <div id="repositoryStatus" class="repository-status muted">불러오는 중...</div>
      <div class="repository-actions">
        <button id="repositoryCloneButton" type="button">저장소 추가</button>
        <button id="repositoryOpenButton" type="button">저장소 열기</button>
      </div>
    </section>

    <section>
      <div class="section-title">워크스페이스</div>
      <div id="workspaceStatus" class="status-text muted">불러오는 중...</div>
    </section>

    <section class="git-panel">
      <button
        id="gitDrawerButton"
        class="git-summary-trigger"
        type="button"
        aria-controls="gitDrawer"
        aria-expanded="false"
      >
        <span class="git-summary-label">Git</span>
        <strong id="gitSummaryBranch">확인 중</strong>
        <span id="gitSummaryChanges" class="git-summary-changes">상태 불러오는 중</span>
        <span class="git-summary-arrow" aria-hidden="true">›</span>
      </button>
    </section>

    <section class="problem-navigation" aria-labelledby="problemNavigationTitle">
      <div id="problemNavigationTitle" class="section-title">문제</div>
      <input
        id="problemFilterInput"
        class="problem-filter"
        type="search"
        placeholder="문제 검색"
        autocomplete="off"
        aria-label="문제 ID, 제목, 폴더 검색"
      />
      <div id="problemList" class="list muted" tabindex="0" aria-label="문제 목록">불러오는 중...</div>
    </section>
  </aside>
