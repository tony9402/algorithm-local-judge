[project]
name = "algorithm-local-judge"
dynamic = ["version"]
description = "Local problem judge with generated test data packs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2026.4.22,<2027",
  "fastapi>=0.136.1,<0.137",
  "playwright>=1.60.0,<1.61",
  "python-multipart>=0.0.28,<0.1",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.46.0,<0.47",
]

[project.scripts]
judge = "judge.cli:main"
problem-studio = "problem_studio.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29",
  "nuitka>=4.0.8,<5",
  "ruff>=0.8.0,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "alj_core",
  "alj_core.utils",
  "alj_launcher",
  "commons",
  "judge",
  "judge.commands",
  "judge.core",
  "judge.utils",
  "judge.web",
  "judge.web.routes",
  "problem_studio",
  "problem_studio.commands",
  "problem_studio.core",
  "problem_studio.web",
  "problem_studio.web.routes",
]

[tool.setuptools.dynamic]
version = {attr = "alj_core.version.__version__"}

[tool.setuptools.package-data]
"judge.web" = ["static/*", "static/app/*.js", "static/styles/*.css"]
"problem_studio.web" = [
  "static/*",
  "static/app/*.js",
  "static/app/actions/*.js",
  "static/app/editor/*.js",
  "static/fragments/*.html",
  "static/styles/*.css",
  "static/vendor/codemirror/*.css",
  "static/vendor/codemirror/*.js",
  "static/vendor/codemirror/addon/dialog/*.css",
  "static/vendor/codemirror/addon/dialog/*.js",
  "static/vendor/codemirror/addon/search/*.js",
  "static/vendor/codemirror/keymap/*.js",
  "static/vendor/codemirror/mode/clike/*.js",
  "static/vendor/codemirror/mode/javascript/*.js",
  "static/vendor/codemirror/mode/python/*.js",
  "static/vendor/codemirror/mode/yaml/*.js",
]

[tool.ruff]
line-length = 99
target-version = "py311"
extend-exclude = [
  "asserts",
  "plan",
  "problems",
  "recovery",
  "working",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Ruff's formatter deliberately does not wrap long prose/docstrings. E501 made
# the format gate permanently red without improving executable-code safety.
ignore = ["E501"]
