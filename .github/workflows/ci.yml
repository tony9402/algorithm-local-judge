name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true
      - run: uv sync --dev --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Checkout pinned problem fixtures
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: tony9402/algorithm-package
          ref: ca9d816bd8a8fca57a686ec0752c69c7f7ce3c23
          path: .ci/problem-fixtures/algorithm-package
          persist-credentials: false
      - name: Link isolated problem fixtures
        run: |
          cp testlib.h .ci/problem-fixtures/algorithm-package/problems/testlib.h
          mkdir -p problems
          ln -s "$GITHUB_WORKSPACE/.ci/problem-fixtures/algorithm-package" \
            problems/algorithm-package
      - name: Unit tests with problems immutability guard
        run: uv run python scripts/run_with_problems_guard.py -- uv run python -m unittest -v

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true
      - run: uv sync --dev --locked
      - run: uv run playwright install --with-deps chromium
      - name: Browser and CLI E2E with problems immutability guard
        env:
          ALJ_TOOL_COMPILE_TIMEOUT_MIN_MS: "30000"
        run: >-
          uv run python scripts/run_with_problems_guard.py --
          uv run python -m unittest discover tests/e2e -p 'e2e_*.py' -v
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true
      - run: uv sync --dev --locked
      - name: Audit runtime dependencies
        run: uv run --with pip-audit==2.10.0 pip-audit .

  packaged-app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true
      - run: uv sync --dev --locked
      - name: Problem Studio package smoke
        run: >-
          uv run python scripts/run_with_problems_guard.py --
          uv run python scripts/smoke_problem_studio_package.py
      - name: Judge package and web smoke
        run: >-
          uv run python scripts/run_with_problems_guard.py --
          uv run python scripts/smoke_judge_web_package.py

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true
      - run: uv sync --dev --locked
      - name: Windows process-tree timeout and memory isolation
        run: >-
          uv run python scripts/run_with_problems_guard.py --
          uv run python -m unittest
          tests.test_process tests.test_windows_job tests.test_runner -v

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true
      - run: uv sync --dev --locked
      - name: Build image and verify the official package in Docker
        env:
          ALJ_RUN_DOCKER_TESTS: "1"
          ALJ_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/run_with_problems_guard.py --
          uv run python -m unittest tests.e2e.e2e_docker_remote_package -v
