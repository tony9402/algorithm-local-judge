name: macOS and Linux source install smoke

on:
  push:
    branches: [main]
    paths:
      - README.md
      - INSTALL.md
      - install.sh
      - scripts/verify_install_docs.py
      - pyproject.toml
      - uv.lock
      - tests/install/**
      - .github/workflows/install-smoke.yml
  pull_request:
    paths:
      - README.md
      - INSTALL.md
      - install.sh
      - scripts/verify_install_docs.py
      - pyproject.toml
      - uv.lock
      - tests/install/**
      - .github/workflows/install-smoke.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: bash -n install.sh
      - run: python scripts/verify_install_docs.py
      - run: python -m unittest discover -s tests/install -p 'test_*.py' -v

  source-install:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: Linux
          - runner: macos-15
            platform: macOS
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: false
      - name: Configure isolated user install paths
        shell: bash
        run: |
          printf 'ALJ_DATA_HOME=%s\n' "$RUNNER_TEMP/algorithm-local-judge-data" >> "$GITHUB_ENV"
          printf 'ALJ_INSTALL_DIR=%s\n' "$RUNNER_TEMP/algorithm-local-judge-runtime" >> "$GITHUB_ENV"
          printf 'ALJ_BIN_DIR=%s\n' "$RUNNER_TEMP/algorithm-local-judge-bin" >> "$GITHUB_ENV"
          printf 'ALJ_SHELL_PROFILE=%s\n' "$RUNNER_TEMP/algorithm-local-judge-profile" >> "$GITHUB_ENV"
      - name: Install from ${{ matrix.platform }} checkout
        run: |
          ./install.sh --skip-checks
          printf '%s\n' "$ALJ_BIN_DIR" >> "$GITHUB_PATH"
      - name: Verify installed launchers
        run: |
          set -euo pipefail
          judge --version
          problem-studio --version
          test "$(readlink "$ALJ_BIN_DIR/judge")" = "$ALJ_INSTALL_DIR/bin/judge"
          test "$(readlink "$ALJ_BIN_DIR/problem-studio")" = "$ALJ_INSTALL_DIR/bin/problem-studio"
          test -f "$ALJ_INSTALL_DIR/.algorithm-local-judge-runtime"
          grep -F "export PATH=$ALJ_BIN_DIR:\$PATH" "$ALJ_SHELL_PROFILE"
          module_path="$("$ALJ_INSTALL_DIR/bin/python" -c 'import judge; print(judge.__file__)')"
          case "$module_path" in
            "$GITHUB_WORKSPACE"/*)
              echo "judge was installed in editable mode: $module_path" >&2
              exit 1
              ;;
          esac
      - name: Verify Judge and Problem Studio readiness
        shell: bash
        run: |
          set -euo pipefail
          run_server() {
              local command_path="$1"
              local port="$2"
              local workspace="${3:-}"
              local log="$RUNNER_TEMP/alj-${port}.log"
              local args=(web --no-open --port "$port")
              if [[ -n "$workspace" ]]; then
                  args+=(--workspace "$workspace")
              fi
              "$command_path" "${args[@]}" >"$log" 2>&1 &
              local pid=$!
              for _ in $(seq 1 60); do
                  if curl --fail --silent "http://127.0.0.1:${port}/readyz" >/dev/null; then
                      kill "$pid" 2>/dev/null || true
                      wait "$pid" 2>/dev/null || true
                      return 0
                  fi
                  if ! kill -0 "$pid" 2>/dev/null; then
                      cat "$log"
                      wait "$pid" 2>/dev/null || true
                      return 1
                  fi
                  sleep 0.5
              done
              cat "$log"
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              return 1
          }
          run_server judge 8765
          run_server problem-studio 8766 "$RUNNER_TEMP/alj-studio-workspace"
