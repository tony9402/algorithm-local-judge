name: Signed standalone release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true
      - run: uv sync --dev --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: >-
          uv run python scripts/run_with_problems_guard.py --
          uv run python -m unittest -v
      - run: >-
          uv run python scripts/run_with_problems_guard.py --
          uv run python -m unittest discover tests/e2e -p 'e2e_*.py' -v
      - run: >-
          uv run python scripts/run_with_problems_guard.py --
          uv run python scripts/smoke_problem_studio_package.py
      - run: >-
          uv run python scripts/run_with_problems_guard.py --
          uv run python scripts/smoke_judge_web_package.py

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true
      - run: uv sync --dev --locked
      - run: uv run python scripts/build_standalone.py --clean
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: standalone-${{ runner.os }}-${{ runner.arch }}
          path: dist/standalone/*.tar.gz
          if-no-files-found: error

  image-build:
    needs: verify
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'tony9402/algorithm-local-judge'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Require release tag to match the Judge version
        shell: bash
        run: |
          expected="v$(python3 -c 'from judge import __version__; print(__version__)')"
          if [[ "${GITHUB_REF_NAME}" != "$expected" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match $expected" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/tony9402/algorithm-local-judge
          tags: type=semver,pattern={{version}},value=${{ github.ref_name }}
      - id: image-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=image,name=ghcr.io/tony9402/algorithm-local-judge,push-by-digest=true,name-canonical=true,push=true
      - name: Export immutable platform digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image-build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid platform image digest: $IMAGE_DIGEST" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/image-digest"
          printf '%s\n' "$IMAGE_DIGEST" \
            > "${RUNNER_TEMP}/image-digest/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/image-digest/${{ matrix.artifact }}
          if-no-files-found: error

  image:
    needs: image-build
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'tony9402/algorithm-local-judge'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/tony9402/algorithm-local-judge
          tags: type=semver,pattern={{version}},value=${{ github.ref_name }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/image-digests
          pattern: image-digest-*
          merge-multiple: true
      - name: Publish the multi-architecture image index
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/tony9402/algorithm-local-judge
          METADATA_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(
            find "${RUNNER_TEMP}/image-digests" -maxdepth 1 -type f | sort
          )
          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "expected two platform image digests" >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="$(tr -d '[:space:]' < "$digest_file")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "invalid platform image digest: $digest" >&2
              exit 1
            fi
            sources+=("${IMAGE_NAME}@${digest}")
          done

          mapfile -t image_tags < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          if [[ "${#image_tags[@]}" -eq 0 ]]; then
            echo "Docker metadata did not produce an image tag" >&2
            exit 1
          fi
          tag_args=()
          for image_tag in "${image_tags[@]}"; do
            tag_args+=(--tag "$image_tag")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

          manifest_json="$(
            docker buildx imagetools inspect "${image_tags[0]}" \
              --format '{{json .Manifest}}'
          )"
          image_digest="$(jq -r '.digest' <<< "$manifest_json")"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid multi-architecture image digest: $image_digest" >&2
            exit 1
          fi
          printf 'IMAGE_DIGEST=%s\n' "$image_digest" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign immutable image digest with GitHub OIDC
        run: >-
          cosign sign --yes
          ghcr.io/tony9402/algorithm-local-judge@${IMAGE_DIGEST}

  publish:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'tony9402/algorithm-local-judge'
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-assets
          pattern: standalone-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the documented Linux source installation flow
        run: uv run python scripts/verify_install_docs.py
      - name: Create checksums and keyless Sigstore bundles
        shell: bash
        run: |
          set -euo pipefail
          for artifact in release-assets/algorithm-local-judge-*.tar.gz; do
            case "$artifact" in
              *-macos-arm64.tar.gz)
                cp "$artifact" release-assets/algorithm-local-judge-macos-arm64.tar.gz ;;
              *-macos-amd64.tar.gz)
                cp "$artifact" release-assets/algorithm-local-judge-macos-amd64.tar.gz ;;
              *-linux-amd64.tar.gz)
                cp "$artifact" release-assets/algorithm-local-judge-linux-amd64.tar.gz ;;
              *-windows-amd64.tar.gz)
                cp "$artifact" release-assets/algorithm-local-judge-windows-amd64.tar.gz ;;
            esac
          done
          python scripts/build_homebrew_formula.py \
            --assets release-assets \
            --tag "${{ github.ref_name }}" \
            --output release-assets/algorithm-local-judge.rb
          sed "s/__ALJ_RELEASE_TAG__/${GITHUB_REF_NAME}/g" \
            scripts/install_local.sh > release-assets/install_local.sh
          for artifact in release-assets/*.tar.gz; do
            checksum="$(sha256sum "$artifact" | awk '{print $1}')"
            printf '%s  %s\n' "$checksum" "$(basename "$artifact")" > "$artifact.sha256"
            cosign sign-blob "$artifact" --bundle "$artifact.sigstore.json" --yes
          done
          (cd release-assets && sha256sum algorithm-local-judge.rb \
            > algorithm-local-judge.rb.sha256)
          cosign sign-blob release-assets/algorithm-local-judge.rb \
            --bundle release-assets/algorithm-local-judge.rb.sigstore.json --yes
          (cd release-assets && sha256sum install_local.sh \
            > install_local.sh.sha256)
          cosign sign-blob release-assets/install_local.sh \
            --bundle release-assets/install_local.sh.sigstore.json --yes
          uv run --with pip-audit==2.10.0 pip-audit . \
            --format cyclonedx-json \
            --output release-assets/algorithm-local-judge.cdx.json
          (cd release-assets && sha256sum algorithm-local-judge.cdx.json \
            > algorithm-local-judge.cdx.json.sha256)
          cosign sign-blob release-assets/algorithm-local-judge.cdx.json \
            --bundle release-assets/algorithm-local-judge.cdx.json.sigstore.json --yes
      - name: Build and validate the immutable stable release manifest
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/build_release_manifest.py \
            --assets release-assets \
            --output release-assets/release-manifest.json \
            --tag "${{ github.ref_name }}" \
            --channel stable \
            --source-commit "${{ github.sha }}" \
            --required-platform macos-arm64 \
            --required-platform macos-amd64 \
            --required-platform linux-amd64 \
            --required-platform windows-amd64
          uv run python scripts/validate_release_manifest.py \
            --manifest release-assets/release-manifest.json \
            --assets release-assets
          (cd release-assets && sha256sum release-manifest.json \
            > release-manifest.json.sha256)
          cosign sign-blob release-assets/release-manifest.json \
            --bundle release-assets/release-manifest.json.sigstore.json --yes
          ALJ_VERIFY_RELEASE_SIGNATURES=1 \
          ALJ_RELEASE_SIGNATURE_REPOSITORY="${{ github.repository }}" \
          uv run python scripts/validate_release_manifest.py \
            --manifest release-assets/release-manifest.json \
            --assets release-assets \
            --stable \
            --require-manifest-sidecars
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "immutable release already exists: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" --generate-notes
          gh release upload "$TAG" release-assets/*
      - name: Verify post-publish asset availability
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir published-assets
          gh release download "$TAG" --dir published-assets
          uv run python scripts/smoke_release_availability.py \
            --assets published-assets
